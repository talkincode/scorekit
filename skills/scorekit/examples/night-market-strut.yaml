# Worked example: a groove-first, non-orchestral identity built from clips.
#
# The four generative patterns (melody/sustain/arpeggio/bass) express a
# chorale. Rhythmic identities need authored events, which is why the cheap
# path defaults to strings — this file is the counterweight: a complete
# GM-only funk vamp in ~70 lines, no strings, no SFZ library required.
#
# Palette declaration (palettes.md inertia rule):
#   - inertia answer: strings + harp bed over slow 4/4
#   - candidates: disco-funk (dry pocket), chiptune (8-bit), percussion-forward
#   - picked: disco-funk — a night market at midnight is interlocking short
#     phrases and air between them, not a pad with a tune on top.
#   - variation axes vs a film-score piece: palette family (plucked/brass vs
#     strings), key+mode (A minor vs whatever the last piece used), tempo
#     class (mid 100 vs slow), lead timbre (plucked vs bowed), pulse (groove
#     vs none), harmony color (static vamp vs default cycle), density.
#
# Two deterministic details that make clip scenes sound like a band instead
# of a grid:
#   - `harmony: [i]` is deliberate: the bass and comping clips carry the
#     harmony in their fixed pitches, so a cycling progression would fight
#     them. Keep the drone, let the riffs move.
#   - `humanize.timing_ms: 0` keeps clip and drums on the same grid (clip
#     timing ignores swing/legato/humanize) while velocity still breathes.
title: Night Market Strut
story: >-
  Midnight street food stalls, a brass player busking between them, and a
  bassist who will not stop. It loops forever because the market does.
tempo: 100
key: A_minor
time_signature: 4/4
bars: 8
loop: true
harmony: [i]

performance:
  humanize: { timing_ms: 0, velocity: 12, seed: 7717 }

clips:
