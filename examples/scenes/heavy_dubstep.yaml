# A protocol-level heavy-Dubstep reference: authored event clips keep every
# bass switch, drum subdivision, and automation gesture reusable and diffable.
# The named texture sources are portable bindings, not bundled recordings.
title: Heavy Dubstep Protocol Reference
story: >-
  Industrial 140 BPM build and two hostile drops. Alternating growl and sub
  phrases, stepped talking-bass motion, metal stabs, dense hats, fills,
  impacts, mechanical risers, and electric glitch-like bursts; no soft EDM
  melody.
tempo: 140
key: F_minor
time_signature: 4/4
bars: 8
loop: true

clips:
  growl_build:
    kind: pitched
    length_beats: 4
    mode: loop
    events:
      pulse_01: { at: 0, duration: 0.5, pitch: F1, velocity: 104 }
      pulse_02: { at: 1, duration: 0.5, pitch: F1, velocity: 110 }
      pulse_03: { at: 2, duration: 0.5, pitch: F#1, velocity: 116 }
      pulse_04: { at: 3, duration: 0.75, pitch: C2, velocity: 124 }
    automation:
      mouth:
        target: cc1
        points:
          start: { at: 0, value: 0 }
          tense_1: { at: 1, value: 48 }
          tense_2: { at: 2, value: 80 }
          tense_3: { at: 3, value: 110 }
          seal: { at: 3.75, value: 0 }
      edge:
        target: cc74
        points:
          start: { at: 0, value: 12 }
          rise: { at: 2, value: 112 }
          seal: { at: 3.75, value: 12 }
      bend:
        target: pitch_bend
        points:
          start: { at: 0, value: 0 }
          pull: { at: 2.75, value: -2400 }
          snap: { at: 3, value: 3200 }
          seal: { at: 3.75, value: 0 }

  talking_drop_a:
    kind: pitched
    length_beats: 4
    mode: loop
    events:
      bark_01: { at: 0, duration: 0.5, pitch: F1, velocity: 127 }
      bark_02: { at: 0.75, duration: 0.25, pitch: C2, velocity: 122 }
      bark_03: { at: 1, duration: 0.5, pitch: F#1, velocity: 127 }
      bark_04: { at: 1.75, duration: 0.25, pitch: C#2, velocity: 120 }
      bark_05: { at: 2, duration: 0.75, pitch: E1, velocity: 127 }
      bark_06: { at: 3, duration: 0.25, pitch: G1, velocity: 124 }
      bark_07: { at: 3.5, duration: 0.25, pitch: C2, velocity: 127 }
    automation:
      mouth:
        target: cc1
        points:
          shut_1: { at: 0, value: 0 }
          open_1: { at: 0.25, value: 127 }
          bite_1: { at: 0.5, value: 32 }
          talk_1: { at: 0.75, value: 96 }
          shut_2: { at: 1, value: 0 }
          open_2: { at: 1.5, value: 120 }
          bite_2: { at: 2, value: 12 }
          open_3: { at: 2.75, value: 110 }
          seal: { at: 3.75, value: 0 }
      edge:
        target: cc74
        points:
          dark_1: { at: 0, value: 8 }
          metal_1: { at: 0.5, value: 127 }
          dark_2: { at: 1, value: 20 }
          metal_2: { at: 1.75, value: 118 }
          dark_3: { at: 2, value: 4 }
          metal_3: { at: 3, value: 124 }
          seal: { at: 3.75, value: 8 }
      bend:
        target: pitch_bend
        points:
          center_1: { at: 0, value: 0 }
          down: { at: 0.5, value: -4096 }
          center_2: { at: 1, value: 0 }
          up: { at: 1.5, value: 4096 }
          center_3: { at: 2, value: 0 }
          tear: { at: 3.25, value: -3072 }
          seal: { at: 3.75, value: 0 }

  talking_drop_b:
    kind: pitched
    length_beats: 4
    mode: loop
    events:
      answer_01: { at: 0, duration: 0.25, pitch: C2, velocity: 127 }
      answer_02: { at: 0.5, duration: 0.5, pitch: E1, velocity: 126 }
      answer_03: { at: 1.25, duration: 0.25, pitch: G1, velocity: 120 }
      answer_04: { at: 1.5, duration: 0.5, pitch: F#1, velocity: 127 }
      answer_05: { at: 2.25, duration: 0.5, pitch: F1, velocity: 127 }
      answer_06: { at: 3, duration: 0.25, pitch: C#2, velocity: 124 }
      answer_07: { at: 3.5, duration: 0.25, pitch: E1, velocity: 127 }
    automation:
      mouth:
        target: cc1
        points:
          shut_1: { at: 0, value: 0 }
          open_1: { at: 0.25, value: 118 }
          choke_1: { at: 0.75, value: 16 }
          open_2: { at: 1.25, value: 127 }
          shut_2: { at: 1.75, value: 0 }
          open_3: { at: 2.25, value: 104 }
          choke_2: { at: 2.75, value: 24 }
          open_4: { at: 3.25, value: 122 }
          seal: { at: 3.75, value: 0 }
      edge:
        target: cc74
