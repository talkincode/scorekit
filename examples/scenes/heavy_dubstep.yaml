  metal_stabs:
    kind: pitched
    length_beats: 4
    mode: loop
    events:
      stab_01: { at: 0, duration: 0.125, pitch: F4, velocity: 120 }
      stab_02: { at: 1.5, duration: 0.125, pitch: C5, velocity: 112 }
      stab_03: { at: 2.5, duration: 0.125, pitch: F#4, velocity: 118 }
      stab_04: { at: 3.25, duration: 0.125, pitch: E4, velocity: 127 }

  build_stabs:
    kind: pitched
    length_beats: 4
    mode: loop
    events:
      tick_01: { at: 0, duration: 0.125, pitch: F4, velocity: 76 }
      tick_02: { at: 2, duration: 0.125, pitch: F4, velocity: 92 }
