      hat_04: { at: 0.75, voice: closed_hat, velocity: 82 }
      hat_05: { at: 1, voice: closed_hat, velocity: 108 }
      hat_06: { at: 1.25, voice: closed_hat, velocity: 78 }
      hat_07: { at: 1.5, voice: closed_hat, velocity: 96 }
      hat_08: { at: 1.75, voice: closed_hat, velocity: 84 }
      hat_09: { at: 2, voice: closed_hat, velocity: 110 }
      hat_10: { at: 2.25, voice: closed_hat, velocity: 80 }
      hat_11: { at: 2.5, voice: closed_hat, velocity: 98 }
      hat_12: { at: 2.75, voice: closed_hat, velocity: 86 }
      hat_13: { at: 3, voice: closed_hat, velocity: 112 }
      hat_14: { at: 3.25, voice: closed_hat, velocity: 88 }
      hat_15: { at: 3.5, voice: closed_hat, velocity: 104 }
      hat_16: { at: 3.75, voice: closed_hat, velocity: 96 }
      fill_low: { at: 3.25, voice: low_tom, velocity: 116 }
      fill_mid: { at: 3.5, voice: mid_tom, velocity: 120 }
      fill_high: { at: 3.75, voice: high_tom, velocity: 127 }

tracks:
  - id: talker
    palette: growl
    instrument: synth_bass
    pattern: clip
    clip: talking_drop_a
    intensity: 1
  - id: sub
    palette: sub
    instrument: synth_bass
    pattern: clip
    clip: sub_drop
    intensity: 1
  - id: metal
    palette: metal
    instrument: square_lead
    pattern: clip
    clip: metal_stabs
    intensity: 0.9
  - id: percussion
    palette: drums
    instrument: drums
    pattern: clip
    clip: drums_drop
    intensity: 1

textures:
  - { source: industrial_bed, mode: loop, gain: 0.18 }
  - { source: drop_impact, mode: one_shot, at: [0], gain: 0.8 }
  - { source: glitch_burst, mode: one_shot, at: [3.5, 7.5, 11.5, 15.5], gain: 0.55 }
  - { source: mechanical_riser, mode: one_shot, at: [3.5], gain: 0.65 }

sections:
  - name: build
    bars: 4
    mute: [sub]
    clips:
      talker: growl_build
      metal: build_stabs
      percussion: drums_build
    intensity: 0.9
  - name: drop_a
    bars: 8
    loop: true
  - name: drop_b
    bars: 8
    loop: true
    clips:
      talker: talking_drop_b
