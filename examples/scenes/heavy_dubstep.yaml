          center_2: { at: 1, value: 0 }
          rip_down: { at: 2, value: -5120 }
          center_3: { at: 2.5, value: 0 }
          snap: { at: 3.25, value: 3584 }
          seal: { at: 3.75, value: 0 }

  sub_drop:
