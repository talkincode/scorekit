name: disco_house
description: Disco-House with fixed club pulse and evolving CC74 chord filter.
rules:
  tempo_min: 124
  tempo_max: 124
  pads_max: 1
  melodic_voices_max: 0
  harmony_allowed: [i, VI, III, VII]
  require_performance: true
  percussion_events_per_bar_min: 24
  percussion_onsets:
    - { voice: kick, positions: [0, 1, 2, 3], coverage_min: 1 }
    - { voice: clap, positions: [1, 3], coverage_min: 1 }
  automation_activity:
    - { track: stab, target: cc74, points_per_bar_min: 1, value_span_min: 90 }
