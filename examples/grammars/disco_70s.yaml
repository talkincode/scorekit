name: disco_70s
description: Live late-1970s Disco with acoustic pulse and orchestral lift.
rules:
  tempo_min: 120
  tempo_max: 120
  pads_max: 1
  melodic_voices_max: 0
  harmony_allowed: [I, IV, ii, V]
  require_performance: true
  percussion_events_per_bar_min: 20
  percussion_onsets:
    - { voice: kick, positions: [0, 1, 2, 3], coverage_min: 1 }
    - { voice: snare, positions: [1, 3], coverage_min: 1 }
