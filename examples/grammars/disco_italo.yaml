name: disco_italo
description: Italo-Disco with rigid machine pulse and octave synth bass.
rules:
  tempo_min: 124
  tempo_max: 124
  pads_max: 1
  melodic_voices_max: 0
  harmony_allowed: [i, VI, III, VII]
  require_performance: true
  percussion_events_per_bar_min: 18
  percussion_onsets:
    - { voice: kick, positions: [0, 1, 2, 3], coverage_min: 1 }
    - { voice: clap, positions: [1, 3], coverage_min: 1 }
