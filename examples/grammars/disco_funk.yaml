name: disco_funk
description: Dry Disco-Funk with interlocking short-note rhythm roles.
rules:
  tempo_min: 112
  tempo_max: 112
  pads_max: 0
  melodic_voices_max: 0
  harmony_allowed: [i, IV, v]
  require_performance: true
  percussion_events_per_bar_min: 14
  percussion_onsets:
    - { voice: kick, positions: [0, 1, 2, 3], coverage_min: 1 }
    - { voice: snare, positions: [1, 3], coverage_min: 1 }
